function buildFixture(){
  const rows = [];
  // Grupos
  const counter = {};
  GROUP_FIXTURES.forEach(([grp, home, away, dt]) => {
    counter[grp] = (counter[grp]||0)+1;
    rows.push({ id:`G-${grp}-${counter[grp]}`, stage:"grupos", grp, home, away,
                kickoff:`${dt}${ET}` });
  });
  // Eliminación
  KO_PLAN.forEach(p => {
    for (let i=1;i<=p.count;i++){
      const d = new Date(p.start+"T00:00:00"+ET);
      d.setDate(d.getDate() + Math.floor((i-1)/p.perDay));
      const dateStr = d.toISOString().slice(0,10);
      rows.push({ id:`K-${p.key}-${i}`, stage:p.key, grp:null,
                  home:"Por definir", away:"Por definir",
                  kickoff:`${dateStr}T${p.time}:00${ET}` });
    }
  });
  return rows;
}

/* ======================= HELPERS ======================= */
function escapeHtml(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function isLocked(m){ return now().getTime() >= new Date(m.kickoff).getTime() - HOUR; }
function specialsLocked(){
  if (!STATE.settings) return false;
  return now().getTime() >= new Date(STATE.settings.tournament_start).getTime() - HOUR;
}
function fmtDate(iso){
  return new Date(iso).toLocaleString("es-AR",{weekday:'short',day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
}
function scorePred(p, m){
  if (!p || p.home==null || p.away==null) return 0;
  if (m.real_home==null || m.real_away==null) return 0;
  if (p.home===m.real_home && p.away===m.real_away) return 5;
  if (Math.sign(p.home-p.away)===Math.sign(m.real_home-m.real_away)) return 3;
  return 0;
}
function toast(msg, ok=true){
  const t=document.createElement("div");
  t.className=`fixed top-3 left-1/2 -translate-x-1/2 z-50 px-4 py-2 rounded-lg text-white text-sm font-semibold shadow-lg ${ok?'bg-brand':'bg-red-600'}`;
  t.textContent=msg; document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2200);
}

/* ======================= CARGA DE DATOS ======================= */
async function ensureProfile(){
  const uid = STATE.user.id;
  let { data:prof } = await sb.from("profiles").select("*").eq("id",uid).maybeSingle();
  if (!prof){
    const username = STATE.user.user_metadata?.username || STATE.user.email.split("@")[0];
    const { data, error } = await sb.from("profiles").insert({ id:uid, username }).select().single();
    if (error){ console.error(error); }
    prof = data;
  }
  STATE.profile = prof;
}

async function loadAll(){
  const uid = STATE.user.id;
  const [mRes, sRes, pRes, spRes, prRes, lbRes, statsRes] = await Promise.all([
    sb.from("matches").select("*").order("kickoff",{ascending:true}),
    sb.from("settings").select("*").eq("id",1).maybeSingle(),
    sb.from("predictions").select("*").eq("user_id",uid),
    sb.from("specials").select("*").eq("user_id",uid).maybeSingle(),
    sb.from("profiles").select("*").order("username"),
    sb.rpc("get_leaderboard"),
    sb.rpc("get_group_stats")
  ]);
  STATE.matches = mRes.data || [];
  STATE.settings = sRes.data || null;
  STATE.myPreds = {};
  (pRes.data||[]).forEach(p => STATE.myPreds[p.match_id] = p);
  STATE.mySpecials = spRes.data || null;
  STATE.profiles = prRes.data || [];
  STATE.leaderboard = lbRes.data || [];
  STATE.stats = statsRes.data || null;
}

async function refresh(){ await loadAll(); render(); }

      </form>
    </div>

  document.getElementById("rpForm").onsubmit = async (e)=>{

    const { data } = await sb.auth.getSession();
    if (data.session?.user){ STATE.user=data.session.user; await ensureProfile(); await loadAll(); }
    render();
  };
}

  document.getElementById("authForm").onsubmit = async (e)=>{
    e.preventDefault();
    const msg=document.getElementById("aMsg"); msg.textContent="";
    const email=document.getElementById("aEmail").value.trim();
    const pass=document.getElementById("aPass").value;
    const username=userInput.value.trim();
    const btn=document.getElementById("aBtn"); btn.disabled=true; const orig=btn.textContent; btn.textContent="...";
    try{
      if (mode==="reg"){
        if (!username){ msg.textContent="Elegí un nombre de usuario."; return; }
        const { data, error } = await sb.auth.signUp({ email, password:pass, options:{ data:{ username } }});
        if (error) throw error;
        if (!data.session){ msg.classList.replace("text-red-600","text-green-600");
          msg.textContent="Cuenta creada. Revisá tu email para confirmar (o desactivá la confirmación en Supabase)."; return; }
        // sesión activa: el onAuthStateChange se encarga del resto
      } else {
        const { error } = await sb.auth.signInWithPassword({ email, password:pass });
        if (error) throw error;
      }
    }catch(err){ msg.textContent = traducirError(err.message); }
    finally{ btn.disabled=false; btn.textContent=orig; }
  };
  setMode("login");
}
function traducirError(m){
  if (/Invalid login/i.test(m)) return "Email o contraseña incorrectos.";
  if (/already registered/i.test(m)) return "Ese email ya está registrado.";
  if (/Password should/i.test(m)) return "La contraseña debe tener al menos 6 caracteres.";
  return m;
}

/* ---- Hoy (partidos del día) ---- */
function renderHoy(c){
  const seeded = STATE.matches.length>0;
  if (!seeded){
    c.innerHTML = `<div class="bg-white rounded-xl shadow-sm p-6 text-center">
      <p class="text-slate-500">Todavía no se cargó el fixture.</p>
    </div>`;
    return;
  }
  const hoy = now();
  const sameDay = (iso)=>{ const d=new Date(iso);
    return d.getFullYear()===hoy.getFullYear() && d.getMonth()===hoy.getMonth() && d.getDate()===hoy.getDate(); };
  const list = STATE.matches.filter(m=>sameDay(m.kickoff)).sort((a,b)=>new Date(a.kickoff)-new Date(b.kickoff));
  const fechaHoy = hoy.toLocaleDateString("es-AR",{weekday:'long',day:'2-digit',month:'long'});

  if (list.length===0){
    const next = STATE.matches.filter(m=>new Date(m.kickoff)>=hoy)
      .sort((a,b)=>new Date(a.kickoff)-new Date(b.kickoff)).slice(0,3);
    c.innerHTML = `
      <div class="mb-3">
        <h2 class="text-lg font-extrabold text-ink capitalize">📅 Hoy · ${fechaHoy}</h2>
        <p class="text-sm text-slate-500">No hay partidos hoy. ¡Día libre! 🎉</p>
      </div>
      ${next.length?`<p class="text-xs font-bold text-slate-400 mb-2 mt-4">PRÓXIMOS PARTIDOS</p>
      <div class="space-y-3">${next.map(matchCard).join("")}</div>`:""}`;
    c.querySelectorAll("[data-save]").forEach(btn=>btn.onclick=()=>savePrediction(btn.dataset.save,btn));
    return;
  }

  c.innerHTML = `
    <div class="mb-3">
      <h2 class="text-lg font-extrabold text-ink capitalize">📅 Hoy · ${fechaHoy}</h2>
      <p class="text-sm text-slate-500">${list.length} partido${list.length>1?'s':''} · cargá tu pronóstico acá mismo</p>
    </div>
    <div class="space-y-3">${list.map(matchCard).join("")}</div>`;
  c.querySelectorAll("[data-save]").forEach(btn=>btn.onclick=()=>savePrediction(btn.dataset.save,btn));
}

function matchCard(m){
  const locked=isLocked(m);
  const pred=STATE.myPreds[m.id];
  const hasResult=m.real_home!=null && m.real_away!=null;
  const pts=hasResult?scorePred(pred,m):null;
  const ptsBadge=pts!=null?`<span class="text-xs font-bold px-2 py-0.5 rounded-full ${pts===5?'bg-green-600 text-white':pts===3?'bg-amber-400 text-ink':'bg-slate-200 text-slate-500'}">${pts} pts</span>`:"";
  const lockBadge=locked?`<span class="text-[11px] font-semibold text-red-500">🔒 Bloqueado</span>`:`<span class="text-[11px] font-semibold text-green-600">✏️ Editable</span>`;
  const dis=locked?"disabled":"";
  const hv=pred&&pred.home!=null?pred.home:"";
  const av=pred&&pred.away!=null?pred.away:"";
  const realLine=hasResult?`<div class="text-center text-xs text-slate-500 mt-2">Resultado real (90'): <b>${m.real_home} - ${m.real_away}</b></div>`:"";
  return `
  <div class="bg-white rounded-xl shadow-sm p-3">
    <div class="flex items-center justify-between mb-2">
      <span class="text-[11px] text-slate-400 font-semibold">${fmtDate(m.kickoff)}</span>
      <div class="flex items-center gap-2">${ptsBadge}${lockBadge}</div>
    </div>
    <div class="grid grid-cols-[1fr_auto_1fr] items-center gap-2">
      <div class="text-right"><div class="text-sm font-semibold leading-tight">${escapeHtml(m.home)}</div><div class="text-2xl">${flag(m.home)}</div></div>
      <div class="flex items-center gap-1">
        <input id="h-${m.id}" type="number" min="0" max="99" value="${hv}" ${dis} class="w-12 h-12 text-center text-xl font-bold border rounded-lg ${locked?'bg-slate-100 text-slate-400':'focus:ring-2 focus:ring-brand'} outline-none" />
        <span class="text-slate-300 font-bold">:</span>
        <input id="a-${m.id}" type="number" min="0" max="99" value="${av}" ${dis} class="w-12 h-12 text-center text-xl font-bold border rounded-lg ${locked?'bg-slate-100 text-slate-400':'focus:ring-2 focus:ring-brand'} outline-none" />
      </div>
      <div class="text-left"><div class="text-2xl">${flag(m.away)}</div><div class="text-sm font-semibold leading-tight">${escapeHtml(m.away)}</div></div>
    </div>
    ${realLine}
    ${!locked?`<button data-save="${m.id}" class="mt-3 w-full bg-brand hover:bg-brand-dark text-white text-sm font-bold py-2 rounded-lg transition">Guardar pronóstico</button>`
             :`<div class="mt-3 text-center text-xs text-slate-400">Pronóstico cerrado · mirá "Comparar"</div>`}
  </div>`;
}

async function savePrediction(id, btn){
  const h=document.getElementById(`h-${id}`).value;
  const a=document.getElementById(`a-${id}`).value;
  btn.disabled=true;
  try{
    if (h===""||a===""){
      await sb.from("predictions").delete().eq("user_id",STATE.user.id).eq("match_id",id);
      delete STATE.myPreds[id];
    } else {
      const row={ user_id:STATE.user.id, match_id:id, home:parseInt(h,10), away:parseInt(a,10), updated_at:new Date().toISOString() };
      const { error } = await sb.from("predictions").upsert(row,{onConflict:"user_id,match_id"});
      if (error) throw error;
      STATE.myPreds[id]=row;
    }
    btn.textContent="✓ Guardado"; btn.classList.add("bg-green-700");
    setTimeout(()=>{btn.textContent="Guardar pronóstico";btn.classList.remove("bg-green-700");btn.disabled=false;},1200);
  }catch(err){ btn.disabled=false; toast(/violates|policy|row-level/i.test(err.message)?"El partido ya está bloqueado.":err.message,false); }
}

/* Desglose partido por partido de MIS puntos */
function detailHtml(){
  const stageName=m=>m.stage==="grupos"?`Grupo ${m.grp}`:(KO_STAGES.find(x=>x.key===m.stage)?.label||m.stage);
  // Solo partidos con resultado cargado, ordenados por fecha
  const played=STATE.matches.filter(m=>m.real_home!=null && m.real_away!=null);
  let matchTotal=0;
  const rows=played.map(m=>{
    const p=STATE.myPreds[m.id];
    const pts=scorePred(p,m); matchTotal+=pts;
    const mine=p?`${p.home}-${p.away}`:"sin cargar";
    const color=pts===5?'bg-green-600 text-white':pts===3?'bg-amber-400 text-ink':'bg-slate-200 text-slate-500';
    return `<div class="flex items-center justify-between px-3 py-2 border-b last:border-0 text-sm">
      <div class="min-w-0"><div class="font-semibold truncate">${flag(m.home)} ${escapeHtml(m.home)} ${m.real_home}-${m.real_away} ${escapeHtml(m.away)} ${flag(m.away)}</div>
        <div class="text-[11px] text-slate-400">${stageName(m)} · tu pronóstico: <b>${mine}</b></div></div>
      <span class="ml-2 flex-shrink-0 text-xs font-bold px-2 py-0.5 rounded-full ${color}">${pts}</span>
    </div>`;
  }).join("");

  // Especiales
  const st=STATE.settings||{}, sp=STATE.mySpecials||{};
  const sChamp=st.champion&&sp.champion===st.champion?15:0;
  const sRunner=st.runner_up&&sp.runner_up===st.runner_up?10:0;
  const sScorer=st.scorer&&sp.scorer&&sp.scorer.trim().toLowerCase()===st.scorer.trim().toLowerCase()?10:0;
  const specialTotal=sChamp+sRunner+sScorer;
  const anySpecial=st.champion||st.runner_up||st.scorer;
  const specialRow=(lbl,mine,pts,max)=>`<div class="flex items-center justify-between px-3 py-2 border-b last:border-0 text-sm">
    <div><div class="font-semibold">${lbl}</div><div class="text-[11px] text-slate-400">tu elección: <b>${mine?escapeHtml(mine):"sin cargar"}</b></div></div>
    <span class="ml-2 text-xs font-bold px-2 py-0.5 rounded-full ${pts>0?'bg-green-600 text-white':'bg-slate-200 text-slate-500'}">${pts>0?'+'+pts:'0/'+max}</span>
  </div>`;

  return `
    <div class="bg-white rounded-xl shadow-sm overflow-hidden fade-in">
      <div class="px-3 py-2 bg-slate-50 font-bold text-sm">Partidos con resultado (${played.length})</div>
      ${played.length===0?`<p class="px-3 py-4 text-center text-slate-400 text-sm">Todavía no hay resultados cargados.</p>`:rows}
      <div class="px-3 py-2 bg-slate-50 text-sm flex justify-between font-bold"><span>Subtotal partidos</span><span>${matchTotal} pts</span></div>
      ${anySpecial?`
        <div class="px-3 py-2 bg-slate-50 font-bold text-sm border-t">Especiales</div>
        ${specialRow('🏆 Campeón', sp.champion, sChamp, 15)}
        ${specialRow('🥈 Subcampeón', sp.runner_up, sRunner, 10)}
        ${specialRow('👟 Goleador', sp.scorer, sScorer, 10)}
        <div class="px-3 py-2 bg-slate-50 text-sm flex justify-between font-bold"><span>Subtotal especiales</span><span>${specialTotal} pts</span></div>`:``}
      <div class="px-3 py-3 bg-brand text-white flex justify-between font-extrabold"><span>TOTAL</span><span>${matchTotal+specialTotal} pts</span></div>
    </div>`;
}

        ${s.top_champions.map(t=>`<div class="flex justify-between py-1 border-b last:border-0 text-sm">
          <span>${flag(t.team)} ${escapeHtml(t.team)}</span><span class="font-bold">${t.count} voto${t.count!=1?'s':''}</span></div>`).join("")}
      </div>` : "";
  const scorerBlock = (s.specials_locked && (s.top_scorers||[]).length)
    ? `<div class="bg-white rounded-xl shadow-sm p-4">
        <h3 class="font-bold mb-2">👟 Goleador más elegido</h3>
        ${s.top_scorers.map(t=>`<div class="flex justify-between py-1 border-b last:border-0 text-sm">
          <span>${escapeHtml(t.name)}</span><span class="font-bold">${t.count} voto${t.count!=1?'s':''}</span></div>`).join("")}
      </div>` : "";
  const specialsNote = !s.specials_locked
    ? `<div class="bg-amber-50 border border-amber-200 rounded-xl p-3 text-amber-700 text-xs">
        🔒 Las tendencias de campeón y goleador se muestran recién cuando se cierran las especiales (1 h antes del partido inaugural), para no influir en las apuestas.</div>` : "";

  c.innerHTML = `
    <h2 class="font-extrabold text-lg mb-3">📈 Estadísticas del grupo</h2>
    <div class="grid grid-cols-2 gap-3 mb-3">
      ${card("👥", "Jugadores", s.players)}
      ${card("📝", "Pronósticos cargados", s.predictions_total, `${pctPred}% de cobertura`)}
      ${card("⚽", "Partidos jugados", `${s.matches_played}/${s.matches_total}`)}
      ${card("📊", "Promedio de puntos", s.avg_points)}
      ${card("🥇", "Mejor puntaje", s.max_points)}
      ${card("🎯", "Aciertos exactos", s.total_exacts, "(5 pts) en todo el grupo")}
    </div>

    <div class="bg-white rounded-xl shadow-sm p-4 mb-3">
      <h3 class="font-bold mb-2">⏰ Próximos a bloquearse</h3>
      ${upcoming.length===0
        ? `<p class="text-sm text-slate-400">No hay partidos próximos a bloquearse.</p>`
        : upcoming.map(m=>`<div class="flex items-center justify-between py-1.5 border-b last:border-0 text-sm">
            <span class="truncate">${flag(m.home)} ${escapeHtml(m.home)} vs ${escapeHtml(m.away)} ${flag(m.away)}</span>
            <span class="text-[11px] text-slate-400 flex-shrink-0 ml-2">${fmtDate(m.kickoff)}</span>
          </div>`).join("")}
      <p class="text-[10px] text-slate-400 mt-2">Recordá: cada partido se cierra 1 h antes del inicio.</p>
    </div>

    ${champBlock}
    ${scorerBlock?`<div class="mt-3">${scorerBlock}</div>`:""}
    ${specialsNote?`<div class="mt-3">${specialsNote}</div>`:""}

    <p class="text-xs text-slate-400 text-center mt-3">Todo agregado del grupo. Las apuestas individuales nunca se muestran acá. Tocá ↻ para refrescar.</p>`;
}

/* ---- Comparar ---- */
function renderComparar(c){
  if (STATE.matches.length===0){ c.innerHTML=`<p class="text-center text-slate-400 py-8">Aún no hay partidos.</p>`; return; }
  if (!UI.cmpMatch) UI.cmpMatch=STATE.matches[0].id;
  c.innerHTML = `
    <h2 class="font-extrabold text-lg mb-1">👥 Transparencia y comparación</h2>
    <p class="text-sm text-slate-500 mb-3">Los pronósticos ajenos se revelan <b>cuando el partido se bloquea</b> (1 h antes). Antes, sólo ves el tuyo.</p>
    <select id="cmpSel" class="w-full mt-1 mb-4 border rounded-lg px-3 py-2.5 bg-white">
      ${STATE.matches.map(m=>`<option value="${m.id}" ${UI.cmpMatch===m.id?'selected':''}>${matchLabel(m)}</option>`).join("")}
    </select>
    <div id="cmpOut" class="text-center text-slate-400 py-6">Cargando…</div>`;
  const sel=document.getElementById("cmpSel");
  sel.onchange=()=>{ UI.cmpMatch=sel.value; drawCompare(); };
  drawCompare();
}
function matchLabel(m){
  const s=m.stage==="grupos"?`Grupo ${m.grp}`:(KO_STAGES.find(x=>x.key===m.stage)?.label||m.stage);
  return `${flag(m.home)} ${m.home} vs ${m.away} ${flag(m.away)} · ${s}`;
}
async function drawCompare(){
  const out=document.getElementById("cmpOut");
  const m=STATE.matches.find(x=>x.id===UI.cmpMatch);
  const locked=isLocked(m);
  if (!locked){
    const mine=STATE.myPreds[m.id];
    out.innerHTML=`<div class="bg-amber-50 border border-amber-200 rounded-xl p-4 text-amber-700 text-sm">
      🔒 Partido no bloqueado todavía. Los pronósticos se revelan 1 h antes del inicio.
      <div class="mt-2 text-ink">Tu pronóstico: <b>${mine?`${mine.home} - ${mine.away}`:"sin cargar"}</b></div></div>`;
    return;
  }
  // Trae predicciones del partido (RLS deja ver sólo las de partidos bloqueados)
  const { data } = await sb.from("predictions").select("user_id,home,away").eq("match_id",m.id);
  const byUser={}; (data||[]).forEach(p=>byUser[p.user_id]=p);
  const hasResult=m.real_home!=null && m.real_away!=null;
  const rows=STATE.profiles.map(pf=>{
    const p=byUser[pf.id];
    return { name:pf.username, txt:p?`${p.home} - ${p.away}`:"—", pts:hasResult&&p?scorePred(p,m):null };
  });
  out.className="";
  out.innerHTML=`
    <div class="bg-white rounded-xl shadow-sm p-4 mb-3 text-center">
      <div class="text-sm font-bold">${matchLabel(m)}</div>
      ${hasResult?`<div class="text-2xl font-extrabold mt-1">${m.real_home} - ${m.real_away}</div><div class="text-xs text-slate-400">resultado real (90')</div>`:`<div class="text-xs text-slate-400 mt-1">Sin resultado cargado</div>`}
    </div>
    <div class="bg-white rounded-xl shadow-sm overflow-hidden">
      ${rows.map(r=>`<div class="flex items-center justify-between px-4 py-2.5 border-b last:border-0">
        <span class="font-semibold">${escapeHtml(r.name)}</span>
        <div class="flex items-center gap-3"><span class="font-bold text-lg">${r.txt}</span>
        ${r.pts!=null?`<span class="text-xs font-bold px-2 py-0.5 rounded-full ${r.pts===5?'bg-green-600 text-white':r.pts===3?'bg-amber-400 text-ink':'bg-slate-200 text-slate-500'}">${r.pts}</span>`:''}</div>
      </div>`).join("")}
    </div>`;
}

/* ---- Admin ---- */
function renderAdmin(c){
  if (!STATE.profile?.is_admin){ c.innerHTML=`<p class="text-center text-slate-400 py-8">Solo administradores.</p>`; return; }
  const st=STATE.settings||{};
  const startVal = st.tournament_start ? toLocalInput(new Date(st.tournament_start)) : "";
  const stageFilters=[{k:"grupos",label:"Grupos"},...KO_STAGES.map(s=>({k:s.key,label:s.label}))];
  let list=STATE.matches.filter(m=>m.stage===UI.filterStage);
  if (UI.filterStage==="grupos") list=list.filter(m=>m.grp===UI.filterGroup);

  c.innerHTML = `
    <h2 class="font-extrabold text-lg mb-3">🛠️ Administrador</h2>
    ${STATE.matches.length===0?`<button id="seedBtn" class="w-full mb-4 bg-ink text-white font-bold py-2.5 rounded-lg">Inicializar fixture (104 partidos)</button>`:``}

    <div class="bg-white rounded-xl shadow-sm p-4 mb-4 space-y-3">
      <h3 class="font-bold">Configuración + resultados especiales</h3>
      <label class="text-xs font-bold text-slate-500">Fecha/hora del partido inaugural</label>
      <input id="cfgStart" type="datetime-local" value="${startVal}" class="w-full border rounded-lg px-3 py-2" />
      <label class="text-xs font-bold text-slate-500">🏆 Campeón</label>
      <select id="cfgCh" class="w-full border rounded-lg px-3 py-2"><option value="">—</option>${ALL_TEAMS.map(t=>`<option ${st.champion===t?'selected':''}>${t}</option>`).join("")}</select>
      <label class="text-xs font-bold text-slate-500">🥈 Subcampeón</label>
      <select id="cfgRu" class="w-full border rounded-lg px-3 py-2"><option value="">—</option>${ALL_TEAMS.map(t=>`<option ${st.runner_up===t?'selected':''}>${t}</option>`).join("")}</select>
      <label class="text-xs font-bold text-slate-500">👟 Goleador</label>
      <input id="cfgSc" type="text" value="${escapeHtml(st.scorer||"")}" class="w-full border rounded-lg px-3 py-2" placeholder="Nombre del jugador" />
      <button id="cfgSave" class="w-full bg-brand text-white font-bold py-2.5 rounded-lg">Guardar y recalcular</button>
    </div>

    <div class="bg-white rounded-xl shadow-sm p-4">
      <h3 class="font-bold mb-2">Cargar resultados (90' + añadido)</h3>
      <div class="flex gap-2 overflow-x-auto pb-2 mb-2 -mx-1 px-1">
        ${stageFilters.map(s=>`<button data-stage="${s.k}" class="astage whitespace-nowrap text-sm px-3 py-1.5 rounded-full font-semibold border ${UI.filterStage===s.k?'bg-brand text-white border-brand':'bg-white text-slate-600'}">${s.label}</button>`).join("")}
      </div>
      ${UI.filterStage==="grupos"?`<div class="flex gap-1.5 overflow-x-auto pb-2 mb-2 -mx-1 px-1">
        ${Object.keys(GROUPS).map(g=>`<button data-group="${g}" class="agroup w-9 h-9 flex-shrink-0 rounded-lg font-bold text-sm ${UI.filterGroup===g?'bg-ink text-white':'bg-white text-slate-600 border'}">${g}</button>`).join("")}
      </div>`:``}
      <div class="space-y-3">${list.map(adminRow).join("")}</div>
    </div>`;

  const seedB=document.getElementById("seedBtn"); if (seedB) seedB.onclick=seedFixture;
  c.querySelectorAll(".astage").forEach(b=>b.onclick=()=>{UI.filterStage=b.dataset.stage;render();});
  c.querySelectorAll(".agroup").forEach(b=>b.onclick=()=>{UI.filterGroup=b.dataset.group;render();});

  document.getElementById("cfgSave").onclick = async ()=>{
    const row={ id:1, tournament_start:new Date(document.getElementById("cfgStart").value).toISOString(),
      champion:document.getElementById("cfgCh").value||null, runner_up:document.getElementById("cfgRu").value||null,
      scorer:document.getElementById("cfgSc").value.trim()||null };
    const { error } = await sb.from("settings").upsert(row,{onConflict:"id"});
    if (error){ toast(error.message,false); return; }
    await refresh(); toast("Configuración guardada");
  };

  c.querySelectorAll("[data-amatch]").forEach(btn=>btn.onclick=()=>saveAdminMatch(btn.dataset.amatch,btn));
}

function adminRow(m){
  const isKO=m.stage!=="grupos";
  const teamSel=(pre,val)=>`<select id="${pre}-${m.id}" class="border rounded px-2 py-1 text-sm w-full"><option value="Por definir" ${val==="Por definir"?'selected':''}>Por definir</option>${ALL_TEAMS.map(t=>`<option ${val===t?'selected':''}>${t}</option>`).join("")}</select>`;
  return `<div class="border rounded-lg p-3">
    ${isKO?`<div class="grid grid-cols-2 gap-2 mb-2">
      <div><label class="text-[10px] font-bold text-slate-400">Local</label>${teamSel('ah',m.home)}</div>
      <div><label class="text-[10px] font-bold text-slate-400">Visitante</label>${teamSel('aa',m.away)}</div></div>
      <label class="text-[10px] font-bold text-slate-400">Fecha/hora</label>
      <input id="adt-${m.id}" type="datetime-local" value="${toLocalInput(new Date(m.kickoff))}" class="border rounded px-2 py-1 text-sm w-full mb-2" />`:``}
    <div class="flex items-center justify-between gap-2">
      <span class="text-sm font-semibold truncate">${flag(m.home)} ${escapeHtml(m.home)}</span>
      <div class="flex items-center gap-1 flex-shrink-0">
        <input id="rh-${m.id}" type="number" min="0" value="${m.real_home??""}" class="w-11 h-9 text-center border rounded font-bold" />
        <span class="text-slate-300">:</span>
        <input id="ra-${m.id}" type="number" min="0" value="${m.real_away??""}" class="w-11 h-9 text-center border rounded font-bold" />
      </div>
      <span class="text-sm font-semibold truncate text-right">${escapeHtml(m.away)} ${flag(m.away)}</span>
    </div>
    <button data-amatch="${m.id}" class="mt-2 w-full bg-brand text-white text-sm font-bold py-1.5 rounded-lg">Guardar</button>
  </div>`;
}

async function saveAdminMatch(id, btn){
  btn.disabled=true;
  const rh=document.getElementById(`rh-${id}`).value;
  const ra=document.getElementById(`ra-${id}`).value;
  const patch={ real_home: rh===""?null:parseInt(rh,10), real_away: ra===""?null:parseInt(ra,10) };
  const home=document.getElementById(`ah-${id}`), away=document.getElementById(`aa-${id}`), dt=document.getElementById(`adt-${id}`);
  if (home) patch.home=home.value;
  if (away) patch.away=away.value;
  if (dt && dt.value) patch.kickoff=new Date(dt.value).toISOString();
  const { error } = await sb.from("matches").update(patch).eq("id",id);
  btn.disabled=false;
  if (error){ toast(error.message,false); return; }
  await refresh(); toast("Guardado");
}

async function seedFixture(){
  const rows=buildFixture();
  const { error } = await sb.from("matches").upsert(rows,{onConflict:"id"});
  if (error){ toast(error.message,false); return; }
  await refresh(); toast("Fixture cargado");
}

function toLocalInput(d){
  const p=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
}

/* ======================= ARRANQUE ======================= */
(function start(){
  if (!initSupabase()){ render(); return; }

  let initialized = false;

  sb.auth.onAuthStateChange(async (event, session)=>{
    if (event==="PASSWORD_RECOVERY"){
      UI.recovery=true; render(); return;
    }
    if (UI.recovery) return;
    // Solo manejar cambios DESPUÉS de la inicialización
    if (!initialized) return;
    if (session?.user){
      STATE.user = session.user;
      await ensureProfile();
      await loadAll();
      render();
    } else {
      STATE.user=null; STATE.profile=null; render();
    }
  });

  // Inicialización principal
  sb.auth.getSession().then(async ({data})=>{
    initialized = true;
    if (data.session?.user){
      STATE.user=data.session.user;
      await ensureProfile();
      await loadAll();
      render();
    } else {
      render();
    }
    // Ahora sí escuchar cambios futuros (logout, login desde otra pestaña)
    sb.auth.onAuthStateChange(async (event, session)=>{
      if (event==="PASSWORD_RECOVERY"){ UI.recovery=true; render(); return; }
      if (UI.recovery) return;
      if (session?.user){
        STATE.user=session.user;
        await ensureProfile(); await loadAll(); render();
      } else {
        STATE.user=null; STATE.profile=null; render();
      }
    });
  });
})();
</script>
